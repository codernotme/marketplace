version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: themrktplace-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: themrktplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  redis:
    image: redis:7-alpine
    container_name: themrktplace-redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: themrktplace-search
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: change-this-master-key
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data

  api:
    build: 
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: themrktplace-api
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    env_file:
      - apps/api/.env

volumes:
  postgres_data:
  meili_data:
