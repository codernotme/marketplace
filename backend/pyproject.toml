[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themrktplace-backend"
version = "0.1.0"
description = "Multi-tenant FastAPI backend for theMrktPlace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "motor>=3.7.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-jose[cryptography]>=3.5.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "orjson>=3.11.0",
  "email-validator>=2.2.0",
  "cachetools>=5.5.2",
  "tenacity>=9.1.2"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.12.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = [
  "background_tasks",
  "core",
  "models",
  "repositories",
  "routers",
  "schemas",
  "services",
  "utils"
]
