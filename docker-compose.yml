version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: themrktplace-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: themrktplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  redis:
    image: redis:7-alpine
    container_name: themrktplace-redis
    ports:
      - "6379:6379"

  typesense:
    image: typesense/typesense:26.0
    container_name: themrktplace-typesense
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_API_KEY: change-this-master-key
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense_data:/data

  api:
    build: 
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: themrktplace-api
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    env_file:
      - apps/api/.env

volumes:
  postgres_data:
  typesense_data:
